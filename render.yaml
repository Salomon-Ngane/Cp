services:
  - type: web
    name: telegram-sports-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: ODDS_API_KEY
        sync: false
